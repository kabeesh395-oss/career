name: Career Hub Automation & Quality Gate

on:
  workflow_dispatch:
    inputs:
      inspection_notes:
        description: 'Optional note for this inspection run'
        required: false
        default: 'Automated CI Quality Gate Run'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # TASK-001: Establish CI Secret Scanner & Safety Gate
  security-gate:
    name: "TASK-001: Secret Scanner & Safety Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Repository for Exposed Secrets & Keys
        run: |
          echo "============================================="
          echo "🔒 Running Pre-Merge Secret & Credential Scan"
          echo "============================================="
          
          # Check for private keys, AWS keys, GitHub tokens, and hardcoded private credentials
          FOUND_SECRETS=0
          
          if git grep -I -E "BEGIN [A-Z]+ PRIVATE KEY" -- ":!.git" ":!tests" ":!.github" ; then
            echo "❌ CRITICAL: Unencrypted Private Key pattern found in repository!"
            FOUND_SECRETS=1
          fi

          if git grep -I -E "AKIA[0-9A-Z]{16}" -- ":!.git" ":!tests" ":!.github" ; then
            echo "❌ CRITICAL: AWS Access Key pattern found in repository!"
            FOUND_SECRETS=1
          fi

          if git grep -I -E "ghp_[0-9a-zA-Z]{36}" -- ":!.git" ":!.github" ; then
            echo "❌ CRITICAL: GitHub Personal Access Token pattern found in repository!"
            FOUND_SECRETS=1
          fi

          if [ $FOUND_SECRETS -ne 0 ]; then
            echo "❌ SECURITY GATE FAILED: High-risk secrets or credentials detected."
            exit 1
          fi

          echo "✅ Security Gate Passed: Zero exposed private keys or tokens detected."

  # Repository State Inspector
  inspect-repository:
    name: "Repository State Inspection"
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute State Inspection Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/inspect_project.py

      - name: Upload Snapshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: career-hub-project-snapshot
          path: career_hub_snapshot.json
          retention-days: 14

  # TASK-002, TASK-003, TASK-004, TASK-006: Backend Service Health, Isolation & Test Suites
  backend-verification:
    name: "TASK-004: Backend Verification & Test Suites"
    runs-on: ubuntu-latest
    needs: [security-gate]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies (TASK-002: Bypasses client/)
        run: |
          npm install

      - name: Compile Backend TypeScript
        run: |
          npm run build

      - name: Execute Security & Tenant Isolation Tests (TASK-003 / TASK-009)
        run: |
          npm run test:security

      - name: Execute Client API Flow Tests
        run: |
          npm run test:qa

      - name: Execute Resume Parsing & ATS Pipeline Tests (TASK-010)
        run: |
          npm run test:resume

      - name: Execute E2E User Journey Integration Tests
        run: |
          npm run test:journey

      - name: Execute AI Queue, Deduplication & Worker Tests (TASK-006)
        run: |
          npm run test:phase3

      - name: Execute Load & Chaos Resilience Tests (TASK-006)
        run: |
          npm run test:load

  # TASK-005: Android app/ Gradle Kotlin DSL Build & Unit Tests
  android-verification:
    name: "TASK-005: Android Gradle Unit Tests"
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
