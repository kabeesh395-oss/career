workflows:
  android-release-workflow:
    name: Career Hub Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.careerpilot.vynwkq"
      java: 21
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Prepare Build Environment and Keystore
        script: |
          set -e
          echo "Preparing environment for Career Hub Android build..."
          chmod +x gradlew

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # Use one stable encrypted release key so upgrades remain installable.
          # Configure these as protected Codemagic environment variables.
          if [ -n "${CAREER_HUB_KEYSTORE_BASE64:-}" ]; then
            echo "$CAREER_HUB_KEYSTORE_BASE64" | base64 --decode > career-hub-release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding the repository-provided signing key..."
            base64 --decode debug.keystore.base64 > career-hub-release.keystore
          else
            echo "ERROR: Configure CAREER_HUB_KEYSTORE_BASE64 or provide debug.keystore.base64."
            echo "A new fallback key is intentionally not generated because it would break app upgrades."
            exit 1
          fi
      - name: Build Android Release APK
        script: |
          set -e
          echo "Building Release APK via Gradle..."
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=career-hub-release.keystore \
            -PRELEASE_STORE_PASSWORD="${CAREER_HUB_STORE_PASSWORD:?CAREER_HUB_STORE_PASSWORD is required}" \
            -PRELEASE_KEY_ALIAS="${CAREER_HUB_KEY_ALIAS:?CAREER_HUB_KEY_ALIAS is required}" \
            -PRELEASE_KEY_PASSWORD="${CAREER_HUB_KEY_PASSWORD:?CAREER_HUB_KEY_PASSWORD is required}"

          BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          APKSIGNER="$(find "$BUILD_TOOLS_DIR" -name apksigner -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$BUILD_TOOLS_DIR" -name zipalign -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ZIPALIGN" -c -v 4 app/build/outputs/apk/release/app-release.apk

          # Create a friendly named copy for easy identification in artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CareerHub-release.apk
            echo "Release APK generated successfully at app/build/outputs/apk/release/CareerHub-release.apk"
          fi
    artifacts:
      - app/build/outputs/apk/release/CareerHub-release.apk
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - kabeesh395@gmail.com
        notify:
          success: true
          failure: true
