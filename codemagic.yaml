workflows:
  android-workflow:
    name: CareerHub Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.careerpilot.vynwkq"
      java: 21
    scripts:
      - name: Build Native Android Release APK
        script: |
          chmod +x gradlew || true
          ./gradlew clean assembleRelease -x lint -x lintVitalRelease
          cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CareerHub.apk 2>/dev/null || true
    artifacts:
      - app/build/outputs/apk/release/CareerHub.apk
      - app/build/outputs/apk/release/*.apk
